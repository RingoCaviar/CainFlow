<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CainFlow · 图片优先画布交互原型</title><link rel="stylesheet" href="artifacts/prototype-image-first-canvas/prototype.css"></head>
<body data-theme="dark"><div id="app">

 <dialog id="general-dialog"><header class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-btn" data-action="dialog-close" aria-label="关闭窗口">×</button></header><div id="dialog-content" class="dialog-content"></div></dialog>
