<!doctype html>
<html lang="zh-CN" data-app-theme="dark">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../index.css">
    <style>#state-controls :is(input, select) { transition: none !important; }</style>
</head>
<body>
    <div id="settings-modal" class="modal-overlay">
        <section class="modal-panel">
            <header class="modal-header"><h2>设置</h2></header>
            <nav class="modal-tabs"><button class="modal-tab-btn active">通用</button></nav>
            <main class="modal-body">
                <section class="settings-section">
                    <article class="general-settings-card api-config-card">
                        <div class="card-header"><span class="card-name">界面设置</span></div>
                        <p class="endpoint-preview">调整 CainFlow 的显示方式。</p>
                        <div class="card-field" id="state-controls">
                            <input id="proxy-ip" data-kind="input" data-state="normal" value="normal">
                            <input class="is-hovered" data-kind="input" data-state="hover" value="hover">
                            <input class="is-focused" data-kind="input" data-state="focus" value="focus">
                            <input data-kind="input" data-state="disabled" value="disabled" disabled>
                            <input data-kind="input" data-state="error" value="error" aria-invalid="true">
                            <select data-kind="select" data-state="normal"><option>normal</option></select>
                            <select class="is-hovered" data-kind="select" data-state="hover"><option>hover</option></select>
                            <select class="is-focused" data-kind="select" data-state="focus"><option>focus</option></select>
                            <select data-kind="select" data-state="disabled" disabled><option>disabled</option></select>
                            <select data-kind="select" data-state="error" aria-invalid="true"><option>error</option></select>
                        </div>
                        <span id="card-probe" style="position:absolute;left:-9999px;background:var(--settings-dialog-section-bg);border:1px solid var(--settings-dialog-panel-border)"></span>
                    </article>
                </section>
            </main>
            <footer class="modal-footer"><span class="footer-left">设置会自动保存</span></footer>
        </section>
    </div>
    <div id="panel-probe" style="position:absolute;left:-9999px;background:var(--settings-dialog-panel-bg);border:1px solid var(--settings-dialog-panel-border);box-shadow:var(--settings-dialog-panel-shadow)"></div>
    <div id="text-probe" style="position:absolute;left:-9999px;color:var(--text-primary)"></div>
    <div id="muted-text-probe" style="position:absolute;left:-9999px;color:var(--settings-dialog-muted-text)"></div>
    <div id="divider-probe" style="position:absolute;left:-9999px;border-top:1px solid var(--settings-dialog-divider)"></div>
    <pre id="surface-result"></pre>
    <script>
        const themeIds = ['dark', 'pro', 'paper', 'light', 'glass-light', 'glass-dark', 'pink'];
        window.addEventListener('load', () => {
            const root = document.documentElement;
            const panel = document.querySelector('#settings-modal .modal-panel');
            const overlay = document.querySelector('#settings-modal');
            const card = document.querySelector('#settings-modal .general-settings-card');
            const title = document.querySelector('#settings-modal .modal-header h2');
            const header = document.querySelector('#settings-modal .modal-header');
            const footer = document.querySelector('#settings-modal .modal-footer');
            const bodyText = document.querySelector('#settings-modal .endpoint-preview');
            const footerText = document.querySelector('#settings-modal .footer-left');
            const panelProbe = document.querySelector('#panel-probe');
            const cardProbe = document.querySelector('#card-probe');
            const textProbe = document.querySelector('#text-probe');
            const mutedTextProbe = document.querySelector('#muted-text-probe');
            const dividerProbe = document.querySelector('#divider-probe');
            const measurements = themeIds.map((themeId) => {
                root.dataset.appTheme = themeId;
                const rootStyle = getComputedStyle(root);
                const bodyStyle = getComputedStyle(document.body);
                const panelStyle = getComputedStyle(panel);
                const cardStyle = getComputedStyle(card);
                const panelProbeStyle = getComputedStyle(panelProbe);
                const cardProbeStyle = getComputedStyle(cardProbe);
                const styleTuple = (element) => {
                    const style = getComputedStyle(element);
                    return {
                        background: style.backgroundColor,
                        border: style.borderTopColor,
                        color: style.color,
                        shadow: style.boxShadow,
                    };
                };
                const semanticStyle = (state) => {
                    const probe = document.createElement('span');
                    probe.style.cssText = 'position:absolute;left:-9999px;border:1px solid transparent;';
                    const stateStyles = {
                        normal: 'background:var(--settings-input-bg);border-color:var(--settings-input-border);color:var(--text-primary);box-shadow:var(--settings-input-shadow)',
                        hover: 'background:var(--settings-input-hover-bg);border-color:var(--settings-input-hover-border);color:var(--settings-input-hover-text);box-shadow:var(--settings-input-shadow)',
                        focus: 'background:var(--settings-input-bg);border-color:var(--settings-input-focus-border);color:var(--text-primary);box-shadow:0 0 0 3px var(--settings-input-focus-ring)',
                        disabled: 'background:var(--settings-input-disabled-bg);border-color:var(--settings-input-disabled-border);color:var(--settings-input-disabled-text);box-shadow:var(--settings-input-shadow)',
                        error: 'background:var(--settings-input-bg);border-color:var(--settings-input-error-border);color:var(--text-primary);box-shadow:0 0 0 3px var(--settings-input-error-ring)',
                    };
                    probe.style.cssText += stateStyles[state];
                    document.querySelector('#settings-modal').append(probe);
                    const result = styleTuple(probe);
                    probe.remove();
                    return result;
                };
                const controlStates = [...document.querySelectorAll('#state-controls [data-state]')].map((control) => ({
                    kind: control.dataset.kind,
                    state: control.dataset.state,
                    actual: styleTuple(control),
                    semantic: semanticStyle(control.dataset.state),
                }));
                return {
                    themeId,
                    actual: {
                        rootBackground: rootStyle.backgroundColor,
                        pageBackground: bodyStyle.backgroundColor,
                        overlayBackground: getComputedStyle(overlay).backgroundColor,
                        panelBackground: panelStyle.background,
                        panelBorder: panelStyle.borderTopColor,
                        panelShadow: panelStyle.boxShadow,
                        cardBackground: cardStyle.background,
                        textColor: getComputedStyle(title).color,
                        bodyTextColor: getComputedStyle(bodyText).color,
                        footerTextColor: getComputedStyle(footerText).color,
                        headerDivider: getComputedStyle(header).borderBottomColor,
                        footerDivider: getComputedStyle(footer).borderTopColor,
                    },
                    semantic: {
                        panelBackground: panelProbeStyle.background,
                        panelBorder: panelProbeStyle.borderTopColor,
                        panelShadow: panelProbeStyle.boxShadow,
                        cardBackground: cardProbeStyle.background,
                        textColor: getComputedStyle(textProbe).color,
                        bodyTextColor: getComputedStyle(mutedTextProbe).color,
                        footerTextColor: getComputedStyle(mutedTextProbe).color,
                        headerDivider: getComputedStyle(dividerProbe).borderTopColor,
                        footerDivider: getComputedStyle(dividerProbe).borderTopColor,
                    },
                    semanticRolesPresent: [
                        '--panel-bg',
                        '--panel-shadow-strong',
                        '--panel-border',
                        '--panel-bg-soft',
                        '--text-secondary',
                        '--text-dim',
                    ].every((role) => rootStyle.getPropertyValue(role).trim() !== ''),
                    controlStates,
                };
            });
            document.querySelector('#surface-result').textContent = JSON.stringify(measurements);
        });
    </script>
</body>
</html>
