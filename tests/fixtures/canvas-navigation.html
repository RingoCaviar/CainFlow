<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/modules/00-foundation.css"><link rel="stylesheet" href="../../css/layout/workbench.css"><link rel="stylesheet" href="../../css/themes.css">
<style>#canvas-container{position:relative;width:900px;height:600px}#nodes-layer{position:absolute;inset:0}</style>
</head><body><div id="canvas-container" tabindex="0"><div id="nodes-layer"></div>
<div id="canvas-navigation"><div class="canvas-node-search"><input type="search"><div class="canvas-node-results"></div></div>
<button data-nav="search">查找节点</button><button data-nav="minus">−</button><output id="zoom-level">100%</output><button data-nav="plus">+</button><button data-nav="reset">100%</button><button data-nav="fit">全图</button></div></div><pre id="surface-result"></pre>
<script type="module">
import {initCanvasNavigation} from '../../js/features/ui/canvas-navigation.js';
import {createViewportApi} from '../../js/canvas/viewport.js';
try {
 const state={canvas:{x:100,y:80,zoom:1},nodes:new Map(),runningNodeIds:new Set(['a'])};
 const canvas=document.getElementById('canvas-container'),layer=document.getElementById('nodes-layer');
 const root=document.getElementById('canvas-navigation');
 const add=(id,title,type)=>{const el=document.createElement('div');el.innerHTML=`<span class="node-title">${title}</span>`;layer.append(el);state.nodes.set(id,{id,type,el,x:0,y:0});};
 add('a','海报生成','ImageGenerate');add('b','海报保存','ImageSave');
 const viewport=createViewportApi({state,elements:{canvasContainer:canvas,nodesLayer:layer,zoomLevel:document.getElementById('zoom-level')},updateAllConnections:()=>{}});
 let focused='',fitCount=-1,saves=0,keys=0,wheels=0;
 initCanvasNavigation({state,canvasContainer:canvas,viewportApi:viewport,zoomToFit:(nodes)=>fitCount=nodes.length,focusNode:(id)=>{focused=id;},scheduleSave:()=>saves++});
 document.addEventListener('keydown',()=>keys++);canvas.addEventListener('wheel',()=>wheels++);
 const click=(name)=>root.querySelector(`[data-nav="${name}"]`).click();
 click('plus');const plus=state.canvas.zoom;
 const anchorPreserved=Math.abs((450-state.canvas.x)/plus-350)<0.01;
 const percent=document.getElementById('zoom-level').textContent;
 click('reset');const reset=state.canvas.zoom;
 click('fit');click('search');
 const input=root.querySelector('input');input.value='海报';input.dispatchEvent(new Event('input'));
 const found=[...root.querySelectorAll('.canvas-node-results button')].map(x=>x.textContent);
 input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',ctrlKey:true,bubbles:true}));
 const shortcutSafe=keys===0 && !focused;
 input.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
 input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
 click('search');state.nodes.clear();layer.replaceChildren();add('c','视频结果','VideoGenerate');
 await new Promise(resolve=>setTimeout(resolve,0));
 const current=[...root.querySelectorAll('.canvas-node-results button')].map(x=>x.dataset.nodeId);
 root.querySelector('.canvas-node-results').dispatchEvent(new WheelEvent('wheel',{bubbles:true}));
 input.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 state.canvas.zoom=5;click('plus');const maximum=state.canvas.zoom;
 state.canvas.zoom=.1;click('minus');const minimum=state.canvas.zoom;
 document.getElementById('surface-result').textContent=JSON.stringify({plus,percent,anchorPreserved,reset,fitCount,focused,found,current,shortcutSafe,wheels,maximum,minimum,saves,closed:!root.classList.contains('search-open')});
}catch(error){document.getElementById('surface-result').textContent=JSON.stringify({error:error.stack});}
</script></body></html>
