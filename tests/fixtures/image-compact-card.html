<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/modules/00-foundation.css">
<link rel="stylesheet" href="../../css/modules/04-node-core.css">
<link rel="stylesheet" href="../../css/modules/07-node-controls.css">
<link rel="stylesheet" href="../../css/themes.css">
<link rel="stylesheet" href="../../css/features/node-canvas-theme-skin.css">
<style>.node{position:relative;width:410px;left:auto;top:auto;margin:24px}.node-body{height:auto}</style>
</head><body><div id="canvas-container"><div id="card" class="node node-generate"></div></div><pre id="surface-result"></pre>
<script type="module">
import { createNodeMarkup } from '../../js/nodes/node-view-factory.js';
import { NODE_CONFIGS } from '../../js/nodes/registry.js';
import { createNodeDomBindingsApi } from '../../js/nodes/node-dom-bindings.js';
import { createNodeLifecycleApi } from '../../js/nodes/node-lifecycle.js';
const result = [];
try {
    for (const theme of ['light','dark','paper','pink','pro','glass-light','glass-dark']) {
        document.documentElement.dataset.appTheme = theme;
        const node = document.getElementById('card');
        node.innerHTML = createNodeMarkup({type:'ImageGenerate', id:'sample', config:NODE_CONFIGS.ImageGenerate,
            restoreData:{apiConfigId:'model', moderation:'low', background:'transparent', quality:'high', prompt:'保留提示词'},
            state:{models:[{id:'model',modelId:'gpt-image-2',taskType:'image',protocol:'openai',providerIds:['provider']}], providers:[{id:'provider',type:'openai',name:'示例'}]}});
        const details = node.querySelector('.node-advanced-parameters');
        const height = node.getBoundingClientRect().height;
        const visible = (suffix) => node.querySelector(`#sample-${suffix}`).checkVisibility();
        const collapsed = !visible('moderation');
        details.open = true;
        const expanded = visible('moderation') && visible('background');
        const expandedHeight = node.getBoundingClientRect().height;
        node.querySelector('#sample-background').value = 'opaque';
        details.open = false;
        result.push({theme, collapsed, expanded, saved:node.querySelector('#sample-background').value,
            quality:visible('quality'), prompt:visible('prompt'), progress:visible('generation-progress'),
            ports:node.querySelectorAll('.node-port').length, height, expandedHeight});
    }
    const node = document.getElementById('card');
    node.id = 'sample';
    const state = {nodes:new Map(),connections:[],selectedNodes:new Set(),runningNodeIds:new Set(),canvas:{zoom:1,x:0,y:0},
        models:[{id:'model',modelId:'gpt-image-2',taskType:'image',protocol:'openai',providerIds:['provider']},
            {id:'other',modelId:'gemini-image',taskType:'image',protocol:'google',providerIds:['provider']}],
        providers:[{id:'provider',type:'openai',name:'示例'}]};
    state.nodes.set('sample',{id:'sample',type:'ImageGenerate',el:node,data:{},x:0,y:0,width:410,height:600});
    const noop=()=>{};
    let geometry=0;
    const projection={nodeGeometryChanged:()=>{geometry++;},nodeAppearanceChanged:noop};
    const lifecycle=createNodeLifecycleApi({state,nodeConfigs:NODE_CONFIGS,nodesLayer:node.parentElement,
        scheduleSave:noop,updateAllConnections:noop,updatePortStyles:noop,connectionProjection:projection});
    const bindings=createNodeDomBindingsApi({state,canvasContainer:node.parentElement,connectionsGroup:document.createElement('div'),
        viewportApi:{},pushHistory:noop,scheduleSave:noop,showToast:noop,debounce:(fn)=>fn,
        fitNodeToContent:lifecycle.fitNodeToContent,connectionProjection:projection});
    bindings.bindNodeInteractions({id:'sample',type:'ImageGenerate',el:node});
    const details=node.querySelector('.node-advanced-parameters');
    details.open=false;
    details.dispatchEvent(new Event('toggle'));
    const compactHeight=node.getBoundingClientRect().height;
    details.open=true;
    details.dispatchEvent(new Event('toggle'));
    const openHeight=node.getBoundingClientRect().height;
    const background=node.querySelector('#sample-background');
    background.value='transparent';
    background.dispatchEvent(new Event('change',{bubbles:true}));
    const summary=node.querySelector('#sample-advanced-summary').textContent;
    const resolution=node.querySelector('#sample-resolution');
    const aspect=node.querySelector('#sample-aspect');
    const requested=node.querySelector('#sample-requested-resolution');
    const aspectWrapper=aspect.nextElementSibling;
    const aspectTrigger=aspectWrapper.querySelector('.node-select-trigger');
    const initialSize={resolution:resolution.value,aspectDisabled:aspect.disabled,
        aspectLabel:aspect.selectedOptions[0]?.textContent,requested:requested.textContent};
    aspectTrigger.click();
    const autoAspectDropdown={triggerDisabled:aspectTrigger.disabled,
        expanded:aspectTrigger.getAttribute('aria-expanded'),panelHidden:aspectWrapper.querySelector('.node-select-panel').classList.contains('hidden'),
        enabledOptionCount:aspectWrapper.querySelectorAll('.node-select-option:not(:disabled)').length};
    aspectTrigger.click();
    resolution.value='1K';resolution.dispatchEvent(new Event('change',{bubbles:true}));
    aspect.value='16:9';aspect.dispatchEvent(new Event('change',{bubbles:true}));
    const aspectFirst={resolution:resolution.value,requested:requested.textContent};
    resolution.value='2K';resolution.dispatchEvent(new Event('change',{bubbles:true}));
    const presetSize={resolution:resolution.value,aspect:aspect.value,requested:requested.textContent,
        readonly:!requested.isContentEditable && !requested.querySelector('input'),customHidden:node.querySelector('#sample-custom-resolution-field').classList.contains('hidden')};
    const noAutoAspectOption=!Array.from(aspect.options).some(option=>option.value==='' || option.textContent==='自动');
    aspectTrigger.click();
    const presetDropdownOpened=aspectTrigger.getAttribute('aria-expanded')==='true';
    aspectWrapper.querySelector('.node-select-option[data-value="1:1"]').click();
    const squareAspectSize={resolution:resolution.value,aspect:aspect.value,requested:requested.textContent,
        savedResolution:state.nodes.get('sample').data.resolution};
    aspect.value='16:9';aspect.dispatchEvent(new Event('change',{bubbles:true}));
    const restoredAspectSize={resolution:resolution.value,aspect:aspect.value,requested:requested.textContent,
        savedResolution:state.nodes.get('sample').data.resolution};
    aspectTrigger.click();
    resolution.value='custom';resolution.dispatchEvent(new Event('change',{bubbles:true}));
    await Promise.resolve();
    const customAspectDropdown={triggerDisabled:aspectTrigger.disabled,
        expanded:aspectTrigger.getAttribute('aria-expanded'),panelHidden:aspectWrapper.querySelector('.node-select-panel').classList.contains('hidden'),
        enabledOptionCount:aspectWrapper.querySelectorAll('.node-select-option:not(:disabled)').length};
    const width=node.querySelector('#sample-custom-resolution-width');
    const heightInput=node.querySelector('#sample-custom-resolution-height');
    const seededCustom={width:width.value,height:heightInput.value};
    width.value='1920';width.dispatchEvent(new Event('input',{bubbles:true}));
    heightInput.value='1088';heightInput.dispatchEvent(new Event('input',{bubbles:true}));
    const customSize={editable:!node.querySelector('#sample-custom-resolution-field').classList.contains('hidden'),
        outputHidden:requested.classList.contains('hidden'),aspectDisabled:aspect.disabled,
        aspectLabel:aspect.selectedOptions[0]?.textContent,
        hint:node.querySelector('#sample-custom-resolution-hint').textContent};
    details.open=false;
    details.dispatchEvent(new Event('toggle'));
    const closedHeight=node.getBoundingClientRect().height;
    const model=node.querySelector('#sample-apiconfig');
    model.add(new Option('Gemini', 'other'));
    state.nodes.get('sample').userResized=true;
    state.nodes.get('sample').width=460;
    node.style.width='460px';
    const beforeModelSwitchHeight=node.getBoundingClientRect().height;
    const beforeModelSwitchMinimum=lifecycle.getNodeMinimumSize(state.nodes.get('sample'),{width:460}).minHeight;
    model.value='other';model.dispatchEvent(new Event('change',{bubbles:true}));
    const afterModelSwitchHeight=node.getBoundingClientRect().height;
    const afterModelSwitchMinimum=lifecycle.getNodeMinimumSize(state.nodes.get('sample'),{width:460}).minHeight;
    const afterModelSwitchWidth=node.getBoundingClientRect().width;
    await Promise.resolve();
    aspectTrigger.click();
    const hiddenOther=node.querySelector('#sample-background-field').classList.contains('hidden');
    const otherModelSize={resolution:resolution.value,customAvailable:Array.from(resolution.options).some(option=>option.value==='custom'),
        aspectDisabled:aspect.disabled,autoAspectAvailable:Array.from(aspect.options).some(option=>option.value==='' && !option.disabled),
        requested:requested.textContent,triggerDisabled:aspectTrigger.disabled,
        dropdownOpened:aspectTrigger.getAttribute('aria-expanded')==='true'};
    model.value='model';model.dispatchEvent(new Event('change',{bubbles:true}));
    const restoredModelHeight=node.getBoundingClientRect().height;
    state.models[0].protocol='';
    state.models[0].providerIds.push('google-provider');
    state.providers.push({id:'google-provider',type:'google',name:'Gemini'});
    const provider=node.querySelector('#sample-provider');
    provider.add(new Option('Gemini','google-provider'));
    const beforeProviderSwitchHeight=node.getBoundingClientRect().height;
    provider.value='google-provider';provider.dispatchEvent(new Event('change',{bubbles:true}));
    const afterProviderSwitchHeight=node.getBoundingClientRect().height;
    provider.value='provider';provider.dispatchEvent(new Event('change',{bubbles:true}));
    const restoredProviderHeight=node.getBoundingClientRect().height;
    const beforeAdvancedToggleWidth=node.getBoundingClientRect().width;
    const beforeAdvancedToggleHeight=node.getBoundingClientRect().height;
    details.open=true;details.dispatchEvent(new Event('toggle'));
    const expandedAdvancedWidth=node.getBoundingClientRect().width;
    const expandedAdvancedHeight=node.getBoundingClientRect().height;
    details.open=false;details.dispatchEvent(new Event('toggle'));
    const collapsedAdvancedWidth=node.getBoundingClientRect().width;
    const collapsedAdvancedHeight=node.getBoundingClientRect().height;
    result.push({bindings:true,compactHeight,openHeight,closedHeight,beforeModelSwitchHeight,beforeModelSwitchMinimum,afterModelSwitchHeight,afterModelSwitchMinimum,afterModelSwitchWidth,restoredModelHeight,beforeProviderSwitchHeight,afterProviderSwitchHeight,restoredProviderHeight,beforeAdvancedToggleWidth,beforeAdvancedToggleHeight,expandedAdvancedWidth,expandedAdvancedHeight,collapsedAdvancedWidth,collapsedAdvancedHeight,geometry,summary,hiddenOther,initialSize,autoAspectDropdown,aspectFirst,presetSize,noAutoAspectOption,presetDropdownOpened,squareAspectSize,restoredAspectSize,customAspectDropdown,seededCustom,customSize,otherModelSize,
        restored:!details.classList.contains('hidden'),saved:background.value,persisted:state.nodes.get('sample').data.background});
    document.getElementById('surface-result').textContent = JSON.stringify(result);
} catch(error) { document.getElementById('surface-result').textContent = JSON.stringify({error:error.stack}); }
</script></body></html>
