<!doctype html><html><body><div id="canvas-container"></div><pre id="surface-result"></pre><script type="module">
import { createPromptAgentController } from '../../js/features/prompt-agent/prompt-agent-controller.js';
import { createPromptAgentReferenceSource } from '../../js/features/prompt-agent/prompt-agent-reference-source.js';
import { createPromptAgentNodeAdapter } from '../../js/features/prompt-agent/prompt-agent-node-adapter.js';

    const page = new DOMParser().parseFromString(await (await fetch('../../index.html')).text(), 'text/html');
    document.body.append(document.importNode(page.getElementById('prompt-agent-panel'), true));
    const original = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aN1sAAAAASUVORK5CYII=';
