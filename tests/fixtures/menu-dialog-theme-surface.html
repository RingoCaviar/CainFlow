<!doctype html>
<html lang="zh-CN" data-app-theme="dark">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../index.css">
    <style>
        *, *::before, *::after { animation: none !important; transition: none !important; }
        body { min-height: 100vh; }
        #surface { display: grid; grid-template-columns: 240px 240px 1fr; gap: 24px; padding: 32px; }
        .context-menu, .theme-menu-panel { position: relative; inset: auto; display: block; }
        .modal-overlay { position: relative; inset: auto; min-height: 440px; }
        .modal-panel { width: min(520px, 90%); height: 360px; }
        .dialog-probes { display: grid; gap: 12px; padding: 12px; }
        .provider-models-panel, .api-settings-help-panel, .help-panel { position: relative; inset: auto; width: 280px; min-height: 96px; }
    </style>
</head>
<body>
    <main id="surface">
        <section class="context-menu">
            <div class="context-menu-header">节点操作</div>
            <div class="context-menu-item" data-kind="menu" data-state="normal">普通</div>
            <div class="context-menu-item is-hovered" data-kind="menu" data-state="hover">悬停</div>
            <div class="context-menu-item is-focused" tabindex="0" data-kind="menu" data-state="focus">焦点</div>
            <div class="context-menu-item is-open" data-kind="menu" data-state="open">展开</div>
            <div class="context-menu-item is-disabled" aria-disabled="true" data-kind="menu" data-state="disabled">禁用</div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item delete" data-kind="menu" data-state="danger">危险</div>
        </section>
        <section class="context-menu context-menu-submenu"><div class="context-menu-item">子菜单</div></section>
        <section class="theme-menu-panel">
            <button class="theme-menu-item">普通主题</button>
            <button class="theme-menu-item is-focused">焦点主题</button>
            <button class="theme-menu-item is-active">当前主题</button>
        </section>
        <section class="modal-overlay">
            <article class="modal-panel">
                <header class="modal-header"><h2>通用弹窗</h2><div><button class="modal-close-btn">×</button><button class="modal-close-btn is-hovered">×</button><button class="modal-close-btn is-focused">×</button></div></header>
                <div class="modal-body"><p>代表性弹窗正文，用于验证语义文字与面板对比度。</p></div>
                <footer class="modal-footer">弹窗页脚</footer>
            </article>
        </section>
    </main>
    <aside class="dialog-probes">
        <section class="help-panel"><header class="help-panel-header"><h3>帮助</h3><div><button class="help-close-btn">×</button><button class="help-close-btn is-hovered">×</button><button class="help-close-btn is-focused">×</button></div></header><div class="help-panel-body">帮助正文</div></section>
        <div class="provider-models-dialog"><section class="provider-models-panel">
            <header class="provider-models-header"><div><h3>模型</h3><div class="provider-models-subtitle">选择可用模型</div></div><div><button class="provider-models-close">×</button><button class="provider-models-close is-hovered">×</button><button class="provider-models-close is-focused">×</button></div></header>
            <div class="provider-models-search-row"><input value="视觉模型"><button class="provider-models-add">+</button></div>
            <div class="provider-models-list">
                <div class="provider-models-row is-hovered"><div><div class="provider-models-row-name">Vision Pro</div><div class="provider-models-row-id">vision-pro</div></div><span class="provider-models-badge">默认</span><button class="provider-models-add is-focused">+</button></div>
                <div class="provider-models-row"><div class="provider-models-row-name">已添加模型</div><span></span><button class="provider-models-add" disabled>已添加</button></div>
            </div>
        </section></div>
        <div class="api-settings-help-dialog"><section class="api-settings-help-panel">
            <header class="api-settings-help-header"><div><h3>设置帮助</h3><div class="api-settings-help-subtitle">配置说明</div></div><div><button class="api-settings-help-close">×</button><button class="api-settings-help-close is-hovered">×</button><button class="api-settings-help-close is-focused">×</button></div></header>
            <div class="api-settings-help-body"><section class="api-settings-help-section"><h4>模型标识</h4><p>填写 <code>provider/model</code> 格式。</p></section></div>
        </section></div>
    </aside>
    <pre id="surface-result"></pre>
    <script>
        const requestedTheme = new URLSearchParams(location.search).get('theme');
        const themeIds = requestedTheme ? [requestedTheme] : ['dark', 'pro', 'paper', 'light', 'glass-light', 'glass-dark', 'pink'];
        addEventListener('load', () => {
            const tuple = (element) => {
                const style = getComputedStyle(element);
                return { background: style.backgroundColor, border: style.borderTopColor, color: style.color, outline: style.outline, opacity: style.opacity };
            };
            const root = document.documentElement;
            document.querySelector('[data-state="focus"]').focus();
            const menu = document.querySelector('.context-menu');
            const submenu = document.querySelector('.context-menu-submenu');
            const themeMenu = document.querySelector('.theme-menu-panel');
            const themeMenuItems = [...document.querySelectorAll('.theme-menu-item')];
            const overlay = document.querySelector('.modal-overlay');
            const panel = document.querySelector('.modal-panel');
            const header = document.querySelector('.modal-header');
            const body = document.querySelector('.modal-body');
            const modalCloseElements = [...document.querySelectorAll('.modal-close-btn')];
            const helpPanel = document.querySelector('.help-panel');
            const providerPanel = document.querySelector('.provider-models-panel');
            const settingsHelpPanel = document.querySelector('.api-settings-help-panel');
            const providerDialog = document.querySelector('.provider-models-dialog');
            const settingsHelpDialog = document.querySelector('.api-settings-help-dialog');
            const providerSearch = document.querySelector('.provider-models-search-row input');
            const providerRow = document.querySelector('.provider-models-row');
            const providerBadge = document.querySelector('.provider-models-badge');
            const providerActions = [...document.querySelectorAll('.provider-models-add')];
            const helpSection = document.querySelector('.api-settings-help-section');
            const helpCode = helpSection.querySelector('code');
            const measurements = themeIds.map((themeId) => {
                root.dataset.appTheme = themeId;
                const rootStyle = getComputedStyle(root);
                return {
                    themeId,
                    menu: tuple(menu),
                    themeMenu: tuple(themeMenu),
                    themeMenuStates: themeMenuItems.map((item, index) => ({ state: ['normal', 'focus', 'active'][index], ...tuple(item) })),
                    states: [...document.querySelectorAll('[data-kind="menu"]')].map((item) => ({ state: item.dataset.state, ...tuple(item) })),
                    dialog: { overlay: tuple(overlay), panel: tuple(panel), header: tuple(header), body: tuple(body), closeStates: modalCloseElements.map((item, index) => ({ state: ['normal', 'hover', 'focus'][index], ...tuple(item) })) },
                    auxiliaryDialogs: {
                        help: { panel: tuple(helpPanel), header: tuple(helpPanel.querySelector('.help-panel-header')), closeStates: [...helpPanel.querySelectorAll('.help-close-btn')].map((item, index) => ({ state: ['normal', 'hover', 'focus'][index], ...tuple(item) })) },
                        provider: { panel: tuple(providerPanel), header: tuple(providerPanel.querySelector('.provider-models-header')), closeStates: [...providerPanel.querySelectorAll('.provider-models-close')].map((item, index) => ({ state: ['normal', 'hover', 'focus'][index], ...tuple(item) })) },
                        settingsHelp: { panel: tuple(settingsHelpPanel), header: tuple(settingsHelpPanel.querySelector('.api-settings-help-header')), closeStates: [...settingsHelpPanel.querySelectorAll('.api-settings-help-close')].map((item, index) => ({ state: ['normal', 'hover', 'focus'][index], ...tuple(item) })) },
                    },
                    providerStates: {
                        search: tuple(providerSearch),
                        row: tuple(providerRow),
                        badge: tuple(providerBadge),
                        action: tuple(providerActions[0]),
                        focusedAction: tuple(providerActions[1]),
                        disabledAction: tuple(providerActions[2]),
                    },
                    helpStates: { section: tuple(helpSection), code: tuple(helpCode) },
                    semantic: Object.fromEntries([
                        '--menu-surface', '--menu-border', '--menu-text', '--menu-muted-text', '--menu-hover-bg', '--menu-active-bg', '--menu-danger-text', '--menu-focus-ring',
                        '--dialog-backdrop', '--dialog-surface', '--dialog-border', '--dialog-divider', '--dialog-shadow', '--dialog-text', '--dialog-muted-text',
                        '--panel-input-bg', '--panel-input-border', '--panel-active-border', '--panel-control-bg', '--panel-control-border', '--panel-control-text',
                        '--panel-control-hover-bg', '--panel-control-hover-border', '--panel-control-hover-text', '--panel-accent-bg', '--panel-accent-border', '--panel-accent-text', '--panel-bg-soft',
                    ].map((role) => [role, rootStyle.getPropertyValue(role).trim()])),
                    layers: {
                        menu: rootStyle.getPropertyValue('--layer-menu').trim(),
                        drawer: rootStyle.getPropertyValue('--layer-drawer').trim(),
                        modal: rootStyle.getPropertyValue('--layer-modal').trim(),
                        popover: rootStyle.getPropertyValue('--layer-modal-popover').trim(),
                    },
                    actualLayers: {
                        menu: getComputedStyle(menu).zIndex,
                        submenu: getComputedStyle(submenu).zIndex,
                        modal: getComputedStyle(overlay).zIndex,
                        provider: getComputedStyle(providerDialog).zIndex,
                        settingsHelp: getComputedStyle(settingsHelpDialog).zIndex,
                        help: getComputedStyle(helpPanel).zIndex,
                    },
                };
            });
            document.querySelector('#surface-result').textContent = JSON.stringify(measurements);
        });
    </script>
</body>
</html>
